<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0D0" />
      <stop offset="30%" stop-color="#F0CF85" />
      <stop offset="70%" stop-color="#C6A15B" />
      <stop offset="100%" stop-color="#8D6B2C" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A4162A" />
      <stop offset="100%" stop-color="#5C071B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Diamond -->
  <polygon points="50,4 96,50 50,96 4,50" fill="#0D0D10" stroke="url(#goldGrad)" stroke-width="2" />
  <polygon points="50,10 90,50 50,90 10,50" fill="none" stroke="url(#redGrad)" stroke-width="1" opacity="0.6" />
  
  <!-- Monogram D A M -->
  <text x="50" y="58" font-family="'Cinzel', serif" font-size="28" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" filter="url(#glow)" letter-spacing="1">DAM</text>
  <circle cx="50" cy="74" r="2" fill="#A4162A" />
</svg>
